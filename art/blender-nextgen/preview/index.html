<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Next-Gen Modellvergleich</title>
<style>
  :root { --bg: #15171a; --panel: #1e2126; --line: #2e333a; --text: #dfe3e8; --dim: #8b939d; --accent: #c8443a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #panel { position: absolute; top: 10px; left: 10px; width: 250px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; max-height: calc(100% - 40px); overflow: auto; }
  #panel h1 { font-size: 14px; margin: 0 0 8px; letter-spacing: .02em; }
  label { display: block; color: var(--dim); margin: 8px 0 3px; font-size: 12px; }
  select, input[type=range] { width: 100%; }
  select { background: #111316; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row label { margin: 0; color: var(--text); }
  #stats { margin-top: 10px; font: 11px/1.45 ui-monospace, Consolas, monospace; color: var(--dim); white-space: pre; }
  .tag { position: absolute; top: 10px; padding: 3px 8px; border-radius: 4px; background: rgba(0,0,0,.55);
    font: 12px system-ui, sans-serif; pointer-events: none; }
  #tagL { left: 272px; } #tagR { right: 10px; }
  #badge { position: absolute; bottom: 10px; right: 10px; padding: 3px 8px; border-radius: 4px;
    background: rgba(0,0,0,.6); color: #e9e9e9; font: 12px system-ui, sans-serif; pointer-events: none; }
  #split { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.35); display: none; pointer-events: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="split"></div>
<div class="tag" id="tagL"></div>
<div class="tag" id="tagR"></div>
<div id="badge">Three.js r128 · exportiertes GLB · gestellte Testszene</div>
<div id="panel">
  <h1>Next-Gen Modellvergleich</h1>
  <label>Asset</label>
  <select id="asset">
    <option value="sedan">Fahrzeug: Urban Premium Sedan</option>
    <option value="enemy">Gegner: Armored Street Enforcer</option>
    <option value="enemy2">Gegner: Enforcer v1 → v2</option>
    <option value="hero">Held: Web Hero Next-Gen</option>
    <option value="hero2">Held: Web Hero v1 → v2</option>
  </select>
  <label>Ansicht</label>
  <select id="which">
    <option value="new">Neu</option>
    <option value="old">Bisher</option>
    <option value="compare">Vergleich (gleiche Kamera, Zeit, Licht)</option>
  </select>
  <label>Animation / Fahrt</label>
  <select id="clip"></select>
  <div class="row" style="margin-top:6px"><input type="checkbox" id="play" checked><label for="play">abspielen</label></div>
  <label>Lackvariante (Sedan)</label>
  <select id="paint"></select>
  <label>Licht</label>
  <select id="mode">
    <option value="gameDay">Spiel-Licht Tag (Sonne + Himmel, linear)</option>
    <option value="gameNight">Spiel-Licht Nacht</option>
    <option value="studio">Studio (sRGB, ACES, Umgebung)</option>
  </select>
  <label>Hintergrund</label>
  <select id="env">
    <option value="neutral">neutral</option>
    <option value="city">Strasse / Stadt</option>
  </select>
  <label>Drehen</label><input type="range" id="yaw" min="-180" max="180" value="35">
  <label>Abstand</label><input type="range" id="dist" min="15" max="140" value="60">
  <label>Hoehe</label><input type="range" id="pitch" min="-10" max="70" value="12">
  <div id="stats"></div>
</div>
<script src="../../../lib/three.min.js"></script>
<script src="../../../lib/GLTFLoader.js"></script>
<script src="../../../lib/SkeletonUtils.js"></script>
<script src="../../../city-visuals.js"></script>
<script src="viewer.js"></script>
</body>
</html>
