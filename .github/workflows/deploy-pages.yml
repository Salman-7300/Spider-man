name: Spiel auf GitHub Pages veröffentlichen

# Veröffentlicht den Spielordner in den Branch gh-pages.
# GitHub Pages liefert diesen Branch automatisch unter
# https://salman-7300.github.io/Spider-man/ aus.

on:
  push:
    branches:
      - main
      - claude/spider-man-game-dev-8cepen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: In den Branch gh-pages veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "Pages-Deploy von $GITHUB_SHA"
          git push origin gh-pages-tmp:gh-pages --force
