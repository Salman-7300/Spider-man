name: 3D-Charaktere aus Release umwandeln (FBX zu GLB)

# Holt die FBX-Dateien aus einem GitHub-Release (bis 2 GB pro Datei!),
# wandelt sie in kleine GLB-Dateien um und committet sie nach assets/.
# Der Push löst danach automatisch das Pages-Deployment aus.
#
# Für welche Figur die Dateien sind, wird am RELEASE-TAG erkannt:
#   Tag "thug-1"      -> Gegner
#   Tag "civilian-1"  -> Zivilist
#   Tag "civilian2-1" -> zweiter Zivilist
#   Tag "hero-1"      -> Held
# Die Dateinamen dürfen bleiben, wie Mixamo sie vergibt
# ("Running (7).fbx", "Idle (5).fbx", ...).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag mit den FBX-Dateien"
        required: true
      slot:
        description: "Figur (hero, civilian, civilian2, civilian3, thug)"
        required: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Spiel-Branch auschecken
        uses: actions/checkout@v4
        with:
          ref: claude/spider-man-game-dev-8cepen

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: FBX-Dateien aus dem Release herunterladen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          mkdir -p tools/input
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir tools/input --pattern "*.fbx" --pattern "*.FBX"
          ls -la tools/input

      - name: Figur aus dem Release-Tag bestimmen
        id: slot
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          SLOT_INPUT: ${{ inputs.slot }}
        run: |
          SLOT="$SLOT_INPUT"
          if [ -z "$SLOT" ]; then
            LOWER=$(echo "$TAG" | tr '[:upper:]' '[:lower:]')
            case "$LOWER" in
              *civilian2*) SLOT=civilian2 ;;
              *civilian3*) SLOT=civilian3 ;;
              *civilian*)  SLOT=civilian ;;
              *hero*)      SLOT=hero ;;
              *thug*|*gegner*) SLOT=thug ;;
            esac
          fi
          if [ -z "$SLOT" ]; then
            echo "Kein Slot im Tag '$TAG' erkannt."
            echo "Bitte den Release-Tag z. B. 'thug-1' oder 'civilian-1' nennen,"
            echo "oder die Dateien '<slot>-<teil>.fbx' benennen."
          else
            echo "Erkannte Figur: $SLOT"
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Abhängigkeiten installieren
        run: npm install --prefix tools --no-audit --no-fund

      - name: FBX nach GLB umwandeln
        env:
          SLOT: ${{ steps.slot.outputs.slot }}
        run: |
          if [ -n "$SLOT" ]; then
            node tools/convert-mixamo.mjs tools/input assets "--slot=$SLOT"
          else
            node tools/convert-mixamo.mjs tools/input assets
          fi

      - name: Umgewandelte Modelle committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.glb
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Modellen."
            exit 0
          fi
          git commit -m "3D-Charaktere aus Release umgewandelt (FBX zu GLB)"
          git push origin claude/spider-man-game-dev-8cepen
